# Application properties
server.port=8080

# Database Configuration (Values injected from .env via System Properties)
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Security (JWT Secret)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

# ML Inference Service (Flask - crop recommendation model)
app.ml.service-url=${ML_SERVICE_URL:http://localhost:5000}
