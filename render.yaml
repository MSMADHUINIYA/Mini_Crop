services:
  # ── ML Service (Flask / Python) ─────────────────────────────────────
  - type: web
    name: minicrop-ml
    runtime: python
    rootDir: ml_service
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
    plan: free

  # ── Backend (Spring Boot / Java) ─────────────────────────────────────
  - type: web
    name: minicrop-backend
    runtime: java
    rootDir: backend
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/backend-0.0.1-SNAPSHOT.jar
    envVars:
      - key: DB_HOST
        sync: false          # fill in Railway MySQL host
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        value: agrismart
      - key: DB_USERNAME
        sync: false          # fill in Railway username
      - key: DB_PASSWORD
        sync: false          # fill in Railway password
      - key: JWT_SECRET
        generateValue: true
      - key: ML_SERVICE_URL
        fromService:
          name: minicrop-ml
          type: web
          property: host
    plan: free
